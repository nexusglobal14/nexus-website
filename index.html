<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Pakistan - Live News & Google Trends</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --accent: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.5; padding: 20px; }

        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
        
        /* Header Banner */
        header { grid-column: 1 / -1; background: var(--card-bg); padding: 20px; border-radius: 12px; border-left: 5px solid var(--accent); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; color: var(--text-main); }
        .logo span { color: var(--accent); }
        .live-clock { background: #0f172a; padding: 8px 16px; border-radius: 8px; border: 1px solid #0284c7; color: #38bdf8; font-weight: bold; font-size: 1.1rem; }

        /* Widget Box */
        .widget { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .widget-title { font-size: 1.1rem; font-weight: 700; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 15px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        
        /* Ticker & Financial Bar */
        .ticker-bar { display: flex; gap: 15px; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.95rem; border: 1px solid var(--border); }
        .ticker-item { flex: 1; text-align: center; }
        .ticker-val { font-weight: bold; color: #4ade80; display: block; font-size: 1.1rem; margin-top: 2px; }

        /* News & Trends Stream */
        .news-item { padding: 12px 0; border-bottom: 1px dashed var(--border); }
        .news-item:last-child { border-bottom: none; }
        .news-title { color: #f8fafc; text-decoration: none; font-weight: 600; display: block; margin-bottom: 4px; transition: color 0.2s; }
        .news-title:hover { color: var(--accent); }
        .news-time { font-size: 0.8rem; color: var(--text-muted); }

        /* Status Badge */
        .status-badge { font-size: 0.75rem; background: #166534; color: #4ade80; padding: 3px 8px; border-radius: 12px; font-weight: 600; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header -->
        <header>
            <div class="logo">NEXUS <span>PAKISTAN</span></div>
            <div class="live-clock">🕒 <span id="clock">--:--:--</span></div>
        </header>

        <!-- Main Column (Local News Feeds) -->
        <main>
            <div class="widget">
                <div class="widget-title">
                    <span>📰 Top Headlines & Live News</span>
                    <span class="status-badge" id="news-status">Local Sync</span>
                </div>
                <div id="news-container">
                    <div style="color: var(--text-muted); text-align: center; padding: 20px;">Loading local news...</div>
                </div>

                <!-- Calculator Website Promotion Button -->
                <div style="margin-top: 20px; text-align: center;">
                    <a href="https://calculator.nexusglobalit.org" target="_blank" rel="noopener noreferrer" style="display: block; background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.2s;">
                        🧮 Explore Nexus Calculator & Tools (calculator.nexusglobalit.org)
                    </a>
                </div>
            </div>
        </main>

        <!-- Sidebar (Market & Google Trends Topics) -->
        <aside>
            <!-- Financial Rates -->
            <div class="widget">
                <div class="widget-title">
                    <span>💹 Live Rates</span>
                    <span class="status-badge">API Live</span>
                </div>
                <div class="ticker-bar">
                    <div class="ticker-item">
                        <span style="color:var(--text-muted);">USD / PKR</span>
                        <span class="ticker-val" id="usd-pkr">Loading...</span>
                    </div>
                    <div class="ticker-item">
                        <span style="color:var(--text-muted);">EUR / PKR</span>
                        <span class="ticker-val" id="eur-pkr">Loading...</span>
                    </div>
                </div>
            </div>

            <!-- Clean Google Trends Topics Widget -->
            <div class="widget">
                <div class="widget-title">
                    <span>🔥 Top 10 Google Trends</span>
                </div>
                <div id="trends-container">
                    <div style="color: var(--text-muted); text-align: center; padding: 10px;">Loading Trends...</div>
                </div>
            </div>
        </aside>

    </div>

    <script>
        // 1. Live Clock
        function startClock() {
            const clockElem = document.getElementById('clock');
            setInterval(() => {
                const now = new Date();
                clockElem.innerText = now.toLocaleTimeString('en-US', { hour12: true });
            }, 1000);
        }

        // 2. Fetch Live Currency Rates
        async function fetchCurrency() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                if (data && data.rates) {
                    const pkr = data.rates.PKR.toFixed(2);
                    const eurToPkr = (data.rates.PKR / data.rates.EUR).toFixed(2);
                    document.getElementById('usd-pkr').innerText = "Rs " + pkr;
                    document.getElementById('eur-pkr').innerText = "Rs " + eurToPkr;
                }
            } catch (err) {
                document.getElementById('usd-pkr').innerText = "Offline";
            }
        }

        // 3. Fetch Local News Feed from Python-generated JSON file
        async function fetchNews() {
            const newsContainer = document.getElementById('news-container');
            const newsStatus = document.getElementById('news-status');
            const jsonUrl = 'latest_news.json?v=' + new Date().getTime(); // Prevent caching
            
            try {
                const res = await fetch(jsonUrl);
                if (!res.ok) throw new Error("Local news file not found");
                
                const items = await res.json();
                
                if (items && items.length > 0) {
                    newsContainer.innerHTML = '';
                    items.slice(0, 6).forEach(item => {
                        let displayTime = "Recent Update";
                        if (item.pubDate) {
                            const parsedDate = new Date(item.pubDate);
                            if (!isNaN(parsedDate.getTime())) {
                                displayTime = parsedDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                            }
                        }
                        
                        const html = `
                            <div class="news-item">
                                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="news-title">${item.title}</a>
                                <span class="news-time">🕒 ${displayTime} | Source: Live Feed</span>
                            </div>
                        `;
                        newsContainer.innerHTML += html;
                    });
                    newsStatus.innerText = "Synced Local";
                    newsStatus.style.background = "#166534";
                } else {
                    throw new Error("Empty news items");
                }
            } catch (err) {
                console.warn("News Read Notice:", err);
                newsStatus.innerText = "File Missing";
                newsStatus.style.background = "#991b1b";
                
                newsContainer.innerHTML = `
                    <div class="news-item" style="border-left: 3px solid #ef4444; padding-left: 10px;">
                        <span class="news-title" style="color: #ef4444;">⚠️ latest_news.json file nahi mili</span>
                        <span class="news-time">Baraye meharbani apni Python script dobara chalayein taake news file generate ho sake.</span>
                    </div>
                `;
            }
        }

        // 4. Read & Parse Google Trends CSV File cleanly (Top 10 Trends with Links)
        async function loadGoogleTrendsCSV() {
            const container = document.getElementById('trends-container');
            const csvUrl = 'Google trends Daily/latest_trends.csv?v=' + new Date().getTime(); // Prevent caching
            
            try {
                const response = await fetch(csvUrl);
                if(!response.ok) throw new Error("CSV file not found");
                
                const csvText = await response.text();
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                
                container.innerHTML = '';
                let count = 0;
                
                for (let i = 1; i < lines.length && count < 10; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    const columns = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const topic = columns[0] ? columns[0].replace(/^"|"$/g, '').trim() : '';
                    let link = columns[1] ? columns[1].replace(/^"|"$/g, '').trim() : '';
                    
                    if (!link || !link.startsWith('http')) {
                        link = `https://www.google.com/search?q=${encodeURIComponent(topic)}`;
                    }

                    if (topic) {
                        count++;
                        const html = `
                            <div class="news-item">
                                <strong style="color: var(--accent);">#${count}</strong> 
                                <a href="${link}" target="_blank" rel="noopener noreferrer" class="news-title" style="display:inline; margin-left:8px;">${topic}</a>
                            </div>
                        `;
                        container.innerHTML += html;
                    }
                }

                if (count === 0) {
                    throw new Error("No valid trends found in CSV");
                }
            } catch (err) {
                console.warn("CSV Read Notice (Fallback Active):", err);
                container.innerHTML = `
                    <div class="news-item"><strong style="color: var(--accent);">#1</strong> <a href="https://www.google.com/search?q=pakistan+stock+exchange" target="_blank" class="news-title" style="display:inline; margin-left:8px;">pakistan stock exchange</a></div>
                `;
            }
        }

        // Initialize Engine
        startClock();
        fetchCurrency();
        fetchNews();
        loadGoogleTrendsCSV();

        // Auto Refresh
        setInterval(fetchCurrency, 60000);        // 1 Minute
        setInterval(fetchNews, 60000);            // 1 Minute (Local JSON sync)
        setInterval(loadGoogleTrendsCSV, 300000);  // 5 Minutes
    </script>

</body>
</html>
